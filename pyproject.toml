[project]
name = "medseg-label-efficiency"
version = "0.1.0"
description = "How many labels does a supervised U-Net need to beat zero-shot promptable foundation models (SAM 2.1, MedSAM2) at medical image segmentation?"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Ahmad Mohammad", email = "ahmad.mmd26@gmail.com" }]
requires-python = ">=3.10"
dependencies = [
    "monai>=1.4",
    "torch>=2.2",
    "nibabel>=5.2",
    "mlflow>=2.14",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "requires_data: needs the CAMUS dataset linked under data/camus",
]
