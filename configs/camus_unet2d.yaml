# CAMUS 2D segmentation baseline. Everything path-like is relative to the
# repo root.
dataset: camus
data_root: data/camus
out_dir: outputs/camus_unet2d
image_size: [256, 256]
batch_size: 16
num_workers: 4
cache_rate: 1.0
seed: 42

model:
  channels: [32, 64, 128, 256, 512]
  strides: [2, 2, 2, 2]
  num_res_units: 2

training:
  epochs: 100
  lr: 1.0e-3
  weight_decay: 1.0e-5
  val_interval: 2
  amp: true
